[project]
name = "paperlens-ai"
version = "0.1.0"
description = "FastAPI service for document ingestion, OCR, extraction, and grounded retrieval."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "pytesseract>=0.3.13,<1.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
